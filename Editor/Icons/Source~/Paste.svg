<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A clipboard: the board outlined, the clip solid on top of it, two lines for what is
       written on it. The board is cut away behind the clip so the two do not overlap. -->
  <defs>
    <mask id="clip-gap">
      <rect x="0" y="0" width="64" height="64" fill="white"/>
      <rect x="19" y="4" width="26" height="18" rx="7" fill="black"/>
    </mask>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="6">
    <rect x="19" y="21" width="26" height="32" rx="5" mask="url(#clip-gap)"/>
  </g>
  <g fill="currentColor">
    <rect x="24" y="9" width="16" height="12" rx="3"/>
    <rect x="24" y="34.4" width="16" height="3.2" rx="1.6"/>
    <rect x="24" y="43.4" width="16" height="3.2" rx="1.6"/>
  </g>
</svg>
